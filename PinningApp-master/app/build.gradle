plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // 读取本地属性，但需容错 local.properties 不存在（如 CI 环境）
    Properties properties = new Properties()
    def localPropsFile = project.rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        properties.load(localPropsFile.newDataInputStream())
    }
    def keyKeyStoreFile = properties.getProperty('keyStoreFile')
    def keyKeyStorePassword = properties.getProperty('keyStorePassword')
    def keyKeyAlias = properties.getProperty('keyAlias')
    def keyKeyAliasPassword = properties.getProperty('keyAliasPassword')
    def hasReleaseKey = (keyKeyStoreFile != null && new File(keyKeyStoreFile).exists())

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keyKeyStoreFile)
                storePassword keyKeyStorePassword
                keyAlias keyKeyAlias
                keyPassword keyKeyAliasPassword
            }
        }
    }

    namespace 'com.hchen.pinningapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.hchen.pinningapp"
        minSdk 30
        targetSdk 34
        //noinspection HighAppVersionCode
        versionCode 2024013100
        versionName "1.0"

        ndk {
            // noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (hasReleaseKey) {
            signingConfig signingConfigs.release
        } else {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/**"
            excludes += "/kotlin/**"
            excludes += "/*.txt"
            excludes += "/*.bin"
            excludes += "/*.json"
        }
        /*dex {
            useLegacyPackaging = true
        }
        jniLibs {
            useLegacyPackaging true
        }*/
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        additionalParameters += '--allow-reserved-package-id'
        additionalParameters += '--package-id'
        additionalParameters += '0x56'
        generateLocaleConfig = true
    }
}

dependencies {

    /*Xposed*/
    compileOnly 'de.robv.android.xposed:api:82'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.luckypray:dexkit:2.0.0'
//    implementation 'com.google.android.material:material:1.11.0'
//    testImplementation 'junit:junit:4.13.2'
//    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}